name: ThermalPrinter
options:
  bundleIdPrefix: com.bash0c7
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
packages:
  ThermalPrinterCore:
    path: Core
targets:
  ThermalPrinter:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    dependencies:
      - package: ThermalPrinterCore
        product: ThermalPrinterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bash0c7.thermalprinter
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  ThermalPrinterUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: ThermalPrinter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bash0c7.thermalprinter.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ThermalPrinter:
    build:
      targets:
        ThermalPrinter: all
    test:
      targets: [ThermalPrinterUITests]
